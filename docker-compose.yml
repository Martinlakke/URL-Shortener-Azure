services:
  # La base de datos
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secreto123
      POSTGRES_DB: urlshortener
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Tu API
  api:
    build: ./app 
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
    depends_on:
      - db

# Volumen para que los datos de la BD persistan
volumes:
  datos_postgres:
